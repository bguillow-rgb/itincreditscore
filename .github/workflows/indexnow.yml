name: IndexNow ping

# After new content ships to /docs (GitHub Pages), submit itincreditscore.com URLs to
# IndexNow so Bing/Yandex/etc. re-crawl quickly. Google ignores IndexNow, but
# Bing feeds ChatGPT/Copilot, so this matters for answer-engine visibility.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No build step, and none needed: indexnow.mjs falls back to the LIVE
      # sitemap when dist/ is absent (dist/ is gitignored, so it always is here).
      # This job runs after /docs is already published, so the live sitemap is
      # the correct source anyway.
      - name: Install dependencies
        run: npm ci

      - name: Ping IndexNow
        # Key is public by design (served at public/f9f0cc34784c71f66a363f7928cfbdb2.txt)
        #
        # Deliberately NOT `|| true`. Pinging is this workflow's only job, so a
        # failure here is a real failure and must surface. The swallowed exit
        # code is what let this run "successfully" for two months while
        # submitting nothing (ENOENT on the then-required dist/sitemap-0.xml).
        # daily-content.yml keeps its `|| true` — there the ping is a non-blocking
        # step at the end of a publish job that must not be failed by it.
        env:
          PUBLIC_INDEXNOW_KEY: f9f0cc34784c71f66a363f7928cfbdb2
        run: node scripts/indexnow.mjs
