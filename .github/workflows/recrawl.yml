name: Recrawl ping (manual)

# Push a chosen set of URLs at Google's Indexing API on demand.
#
# Why this exists: daily-content.yml pings the Indexing API with
# `--article <slug>`, so ONLY the newest daily article's two URLs are ever
# submitted. The money pages and the whole /es section have never been sent.
# The 2026-08-03 audit measured the consequence — the daily articles were being
# crawled and ranking (pos 5-13) while /check-credit-score-with-itin sat 39 days
# stale and /es 55 days stale, both last crawled in June.
#
# Use this after any deploy that changes a money page, a hub page, or the ES
# section — i.e. any time the daily-content job is not the thing that changed it.
#
# IndexNow (Bing/Yandex/etc.) is handled separately and automatically by
# indexnow.yml on every push to docs/**; it submits the full sitemap, so it does
# not have this gap. This job is Google-only.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space- or newline-separated paths (/foo) or full URLs. Leave blank for the priority set below.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: recrawl
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The priority set is the commercial + Spanish surface that the daily
      # article ping never touches. Google's Indexing API quota is 200 URLs/day,
      # so this list stays deliberately short rather than resubmitting all 122.
      - name: Ping Google Indexing API
        env:
          GOOGLE_INDEXING_SA_KEY: ${{ secrets.GOOGLE_INDEXING_SA_KEY }}
          URLS: ${{ inputs.urls }}
        run: |
          set -euo pipefail
          if [ -z "${URLS// /}" ]; then
            URLS="/check-credit-score-with-itin
          /es
          /es/check-credit-score-with-itin
          /es/itin-credit-score-guide
          /itin-credit-score-guide
          /credit-bureaus-and-itin
          /build-credit-history-with-itin
          /about
          /credit-readiness-calculator
          /es/build-credit-history-with-itin
          /es/credit-bureaus-and-itin
          /articles"
          fi
          # shellcheck disable=SC2086
          node scripts/google-index.mjs $URLS
